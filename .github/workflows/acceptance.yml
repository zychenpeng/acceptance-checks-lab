name: Fixture acceptance

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head:
        description: Exact PR head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: acceptance-fixture
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-save --no-package-lock --ignore-scripts vitest@4.1.7
      - name: Run original test and publish the head-bound result
        run: node scripts/acceptance.mjs
        env:
          PR_NUMBER: ${{ inputs.pr }}
          PR_HEAD: ${{ inputs.head }}
          GH_TOKEN: ${{ github.token }}
          BUZZER_FIXTURE: ${{ secrets.BUZZER_FIXTURE }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: acceptance-result
          path: ${{ runner.temp }}/acceptance-result.json
          if-no-files-found: ignore
          retention-days: 14
